syntax = "proto3";
package teleportkit.resources;

message ListResourcesRequest {
  string resource_type = 1;
  string namespace = 2;
  int32 limit = 3;
  string start_key = 4;
  bool include_logins = 13;
}
message ListResourcesResponse {
  repeated Resource resources = 1;
  string next_key = 2;
}
message Resource {
  Server node = 3;
  repeated string logins = 13;
  bool requires_request = 14;
}
message Server {
  string kind = 1;
  Metadata metadata = 4;
  Spec spec = 5;
}
message Metadata {
  string name = 1;
  map<string, string> labels = 5;
}
message Spec { string hostname = 3; }
